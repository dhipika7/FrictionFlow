version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: frictionflow-db
    environment:
      POSTGRES_USER: friction_user
      POSTGRES_PASSWORD: friction_password
      POSTGRES_DB: frictionflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friction_user -d frictionflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frictionflow-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./frictionflow.db
      - AI_PROVIDER=mock
      - DEMO_MODE=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frictionflow-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
